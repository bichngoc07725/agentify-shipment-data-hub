authentication:
  api_key:
    name: "X-Internal-API-Key"
    value: "${INTERNAL_API_KEY}"
  cors:
    allow_ips:
      - "*"
    allow_origins: []
    # Single-quoted: the value is a regex, and YAML would treat `\.` inside
    # double quotes as an unknown escape sequence and fail to parse.
    allow_origins_regex: '${ALLOW_ORIGINS_REGEX}'
  jwt:
    secret_key: "${SECRET_KEY}"
    algorithm: "HS256"
    expire_minutes: 480

databases:
  postgres:
    url: "${DATABASE_URL}"
    pool:
      size: 10
      max_overflow: 20
      timeout: 30
      recycle: 1800

app:
  name: "agentify-logistics-backend"
  title: "Agentify Logistics API"
  description: "Container-centric API for ingesting and searching logistics email and PDF data."
  proxy_root_path: "${APP_PROXY_ROOT_PATH}"
  uvicorn_logging_format: "%(asctime)s %(levelname)s [%(name)s] [%(filename)s:%(lineno)d] - %(message)s"

gmail_service:
  query: "${GMAIL_QUERY}"
  oauth:
    credentials_file: "${GMAIL_CREDENTIALS_FILE}"
    redirect_uri: "${GMAIL_REDIRECT_URI}"
    frontend_return_url: "${GMAIL_FRONTEND_RETURN_URL}"
  extraction:
    # auto | azure_openai | gemini | none
    # auto prefers Azure when it is fully configured, then Gemini, then rules only.
    provider: "${EXTRACTION_PROVIDER}"
    api_key: "${GEMINI_API_KEY}"
    model: "${GEMINI_MODEL}"
    azure:
      # Full Responses API URL, not just the resource host.
      endpoint: "${AZURE_OPENAI_ENDPOINT}"
      api_key: "${AZURE_OPENAI_API_KEY}"
      # Deployment name, not the base model name.
      deployment: "${AZURE_OPENAI_DEPLOYMENT}"
      reasoning_effort: "low"
