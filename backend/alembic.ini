[alembic]
script_location = alembic
prepend_sys_path = .
# Giá trị này KHÔNG được dùng: `alembic/env.py` luôn ghi đè bằng biến môi
# trường `DATABASE_URL` (hoặc cấu hình trong `config/`). Giữ placeholder ở đây
# vì file được commit lên repo public.
sqlalchemy.url = postgresql+psycopg://YOUR-DB-USER:YOUR-DB-PASSWORD@YOUR-DB-HOST:5443/agentify

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
